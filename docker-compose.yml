services:
  traveler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traveler-app
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
